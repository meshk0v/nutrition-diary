<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>Дневник питания</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=1795365957">
  <script src="https://telegram.org/js/telegram-web-app.js?v=1795365957"></script>
  <script src="config.js?v=1795365957"></script>
</head>
<body class="booting">
  <div class="boot" id="boot"><div class="spin" id="bootSpin"></div></div>
  <div id="app">
    <header class="top">
      <div>
        <div class="hello" id="hello">Дневник питания</div>
        <div class="sub" id="sub">Загрузка…</div>
      </div>
      <div class="top-right">
        <button class="admin-btn hidden" id="adminBtn">🛠 Админка</button>
        <button class="help-btn hidden" id="helpBtn" aria-label="Как пользоваться">?</button>
      </div>
    </header>
    <div class="banner stale hidden" id="staleBanner"></div>
    <div class="banner hidden" id="demoBanner">Демо-режим: показан тестовый участник. В Telegram откроются ваши данные.</div>

    <main>
      <!-- Отчёт дня (формат тренера) -->
      <section class="tab active" id="tab-report">
        <div id="repDay"></div>
        <div class="card plan" id="planCard"></div>
        <div id="repStatus"></div>
        <form id="reportForm" class="card rep-form" autocomplete="off"></form>
      </section>

      <!-- Итоги -->
      <section class="tab" id="tab-results">
        <div class="res-cards" id="resCards"></div>
        <div class="card"><div class="section-head inner"><h2>Калории за 14 дней</h2><span class="muted" id="kcalAvg"></span></div><div id="kcalChart"></div></div>
        <div class="card"><div class="section-head inner"><h2>Белок за 14 дней</h2><span class="muted" id="protAvg"></span></div><div id="protChart"></div></div>
        <div class="card"><h2>По неделям</h2><div id="weeksTable"></div></div>
        <div class="card"><h2>Замеры: старт → сейчас</h2><div id="measProgress"></div></div>
      </section>


      <!-- Меню -->
      <section class="tab" id="tab-menu">
        <div class="card menu-head" id="menuHead"></div>
        <div class="days" id="dayChips"></div>
        <div id="dayMeals"></div>
      </section>


      <!-- Замеры -->
      <section class="tab" id="tab-progress">
        <div class="card">
          <div class="section-head inner"><h2>Вес</h2><span class="muted" id="weightDelta"></span></div>
          <div id="weightChart" class="chart"></div>
        </div>
        <div class="card" id="lastMeasure"></div>
        <div class="card">
          <h2>Новый замер</h2>
          <div class="muted" style="margin-top:4px">По воскресеньям утром, натощак. Сантиметровой лентой, без нажима.</div>
          <form id="measureForm" class="grid4" autocomplete="off"></form>
        </div>
      </section>
    </main>

    <nav class="tabs">
      <button data-tab="report" class="active"><span class="ic">📝</span>Отчёт</button>
      <button data-tab="menu"><span class="ic">📋</span>Меню</button>
      <button data-tab="progress"><span class="ic">📏</span>Замеры</button>
      <button data-tab="results"><span class="ic">📊</span>Итоги</button>
    </nav>
    </div>

  <!-- Рецепт -->
  <div class="sheet hidden" id="recipeSheet">
    <div class="sheet-body compact">
      <div class="sheet-top">
        <div class="q-title" id="rTitle"></div>
        <button class="close" data-close>✕</button>
      </div>
      <div id="rBody"></div>
    </div>
  </div>

  <!-- Обучение: подсветка вкладок по очереди -->
  <div class="tour hidden" id="tour">
    <div class="tour-spot" id="tourSpot"></div>
    <div class="tour-card" id="tourCard">
      <div class="tour-ic" id="tourIc"></div>
      <div class="tour-t" id="tourT"></div>
      <div class="tour-x" id="tourX"></div>
      <div class="tour-nav">
        <div class="tour-dots" id="tourDots"></div>
        <button class="tour-skip" id="tourSkip">Пропустить</button>
        <button class="btn primary" id="tourNext">Далее</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>
  <script src="app.js?v=1795365957"></script>
</body>
</html>
